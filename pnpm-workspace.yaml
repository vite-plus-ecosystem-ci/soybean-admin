packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  typescript: npm:typescript-native-bridge@latest
overrides:
  typescript: 'catalog:'
  vite@*: 'catalog:'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@iconify/json@2.2.541'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
