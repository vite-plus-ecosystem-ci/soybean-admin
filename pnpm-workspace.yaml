packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  typescript: npm:typescript-native-bridge@latest
overrides:
  vite: 'catalog:'
  typescript: 'catalog:'
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  simple-git-hooks: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@iconify/json@2.2.541'
